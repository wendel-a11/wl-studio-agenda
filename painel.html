<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Admin - WL Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Painel Admin - Agendamentos</h2>

<input type="password" id="senha" placeholder="Senha admin">
<button onclick="entrarAdmin()">Entrar</button>

<hr>

<div id="painel" style="display:none">
  <h3>Agendamentos</h3>
  <ul id="lista"></ul>
</div>

<script src="firebase.js"></script>

<script type="module">
  import { collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const SENHA_ADMIN = "wl@00";

  window.entrarAdmin = async function () {
    const senha = document.getElementById("senha").value;
    if (senha !== SENHA_ADMIN) {
      alert("Senha incorreta");
      return;
    }

    document.getElementById("painel").style.display = "block";
    carregarAgendamentos();
  };

  async function carregarAgendamentos() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    const querySnapshot = await getDocs(collection(window.db, "agendamentos"));

    querySnapshot.forEach((docu) => {
      const data = docu.data();

      const li = document.createElement("li");
      li.innerHTML = `
        <strong>${data.nome}</strong><br>
        ${data.telefone}<br>
        ${data.data} - ${data.horario}<br>
        <button onclick="excluir('${docu.id}')">Cancelar</button>
        <hr>
      `;
      lista.appendChild(li);
    });
  }

  window.excluir = async function (id) {
    if (confirm("Cancelar esse agendamento?")) {
      await deleteDoc(doc(window.db, "agendamentos", id));
      carregarAgendamentos();
    }
  };
</script>

</body>
</html>
