<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WL Studio - Agenda</title>
  </head>
  <script type="module">
  import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  async function agendar() {
    const nome = document.getElementById("nome").value;
    const telefone = document.getElementById("telefone").value;
    const data = document.getElementById("data").value;
    const horario = document.getElementById("horario").value;

    if (!nome || !telefone || !data || !horario) {
      document.getElementById("msg").innerText = "Preencha tudo!";
      return;
    }

    try {
      await addDoc(collection(window.db, "agendamentos"), {
        nome,
        telefone,
        data,
        horario,
        criadoEm: new Date()
      });

      document.getElementById("msg").innerText = "Horário agendado com sucesso!";
      document.getElementById("nome").value = "";
      document.getElementById("telefone").value = "";
      document.getElementById("data").value = "";
      document.getElementById("horario").value = "";
    } catch (e) {
      document.getElementById("msg").innerText = "Erro ao agendar.";
      console.error(e);
    }
  }

  window.agendar = agendar;
  </script>
  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</html>
<section id="agendamento">
  <h2>Agendar horário</h2>

  <input type="text" id="nome" placeholder="Seu nome" required>
  <input type="tel" id="telefone" placeholder="Seu WhatsApp" required>

  <input type="date" id="data" required>

  <select id="horario" required>
    <option value="">Selecione o horário</option>
    <option>07:00</option>
    <option>08:00</option>
    <option>09:00</option>
    <option>10:00</option>
    <option>11:00</option>
    <option>12:00</option>
    <option>13:00</option>
    <option>14:00</option>
    <option>15:00</option>
    <option>16:00</option>
    <option>17:00</option>
    <option>18:00</option>
    <option>19:00</option>
    <option>20:00</option>
    <option>21:00</option>
  </select>

  <button onclick="agendar()">Confirmar agendamento</button>

  <p id="msg"></p>
</section>
